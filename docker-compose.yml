services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stock:stock@db:5432/stock
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-please}
      AUTH_TRUST_HOST: "true"
      LDAP_URL: ${LDAP_URL:-ldaps://SRV-DC01.cmpc.local:636,ldaps://SRV-DC02.cmpc.local:636}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=cmpc,DC=local}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-cmpc.local}
      LDAP_GROUP: ${LDAP_GROUP:-GG_Sistemas}
      LDAP_GROUP_DN: ${LDAP_GROUP_DN:-}
      LDAP_TLS_CA_FILE: /app/certs/ldaps-certificados-publicos.pem
      NODE_EXTRA_CA_CERTS: /app/certs/ldaps-certificados-publicos.pem
      LDAP_TLS_INSECURE: ${LDAP_TLS_INSECURE:-false}
      AUTH_ALLOW_LOCAL: ${AUTH_ALLOW_LOCAL:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Operador Sistemas}
    volumes:
      # Si el PEM no está en la imagen, montalo desde el host
      - ./ldaps-certificados-publicos.pem:/app/certs/ldaps-certificados-publicos.pem:ro
    ports:
      # Host:contenedor — cambiá APP_PORT en .env si 3000 está ocupado
      - "${APP_PORT:-3001}:3000"

volumes:
  postgres_data:
